name: follio
description: "A production-grade personal portfolio web app in Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.8.1
  shared_preferences: ^2.5.2
  http: ^1.3.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  crypto: ^3.0.7
  file_picker: ^13.1.0
  syncfusion_flutter_pdf: ^34.2.8
  flutter_secure_storage: ^11.2.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
